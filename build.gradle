plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        url = "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/cesium.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    include(implementation("com.github.luben:zstd-jni:1.5.7-3"))
    include(implementation("org.lmdbjava:lmdbjava:0.9.1"))

    include(implementation("com.github.jnr:jffi:1.3.13"))
    include(implementation("com.github.jnr:jffi:1.3.13:native"))
    include(implementation("com.github.jnr:jnr-a64asm:1.0.0"))
    include(implementation("com.github.jnr:jnr-constants:0.10.4"))
    include(implementation("com.github.jnr:jnr-ffi:2.2.17"))
    include(implementation("com.github.jnr:jnr-x86asm:1.0.2"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_CESIUM" }
    }
}